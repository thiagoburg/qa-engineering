name: TaskFlow QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-qa
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskflow-qa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser and API checks
        run: npm test

      - name: Upload test report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-playwright-${{ github.run_id }}
          path: |
            taskflow-qa/playwright-report/
            taskflow-qa/test-results/
          if-no-files-found: ignore
          retention-days: 14
